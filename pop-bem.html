<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/reset.css">
  <title>Document</title>
</head>
<style>
  .popup__modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 3;
  }
  .popup {
    width: 370px;
    background-color: #fff;
    border: 1px solid #560891;
    border-radius: 5px;
    box-shadow: 0 0 8px #333;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1rem;
  }
  
  .popup__header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    background-color: #6f25a7;
  }
  .popup__content--header {
    padding: 10px;
    font-weight: bold;
  }
  .popup__close-btn {
    position: relative;
    width: 35px;
    height: 35px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .popup__close-btn::before,
  .popup__close-btn::after {
    content: '';
    position: absolute;
    width: 70%;
    height: 2px;
    background-color: #fff;
    border-radius: 2px;
  }
  .popup__close-btn:hover::before,
  .popup__close-btn:hover::after {
    background-color: #ffffffea;
  }
  .popup__close-btn::before {
    transform: rotate(50deg);
  }

  .popup__close-btn::after {
    transform: rotate(-50deg);
  }
  .popup__content {
    padding: 0 10px 10px 10px;
  }
  
  .popup__item:not(:last-child) {
    display: flex;
    margin-bottom: 10px;
    font-size: 1rem;
  }
  
  .popup__label {
    font-weight: bold;
  }
  
  .popup__value {
    color: #6f25a7;
  }
  .popup__border-line {
    width: 100%;
    height: 1px;
    background-color: #ccc;
  }
  .popup__actions {
    width: 100%;
    display: flex;
    justify-content: space-around;
    padding: 0 10px 10px 10px;
    column-gap: 0.3rem;
  }
  
  .popup__confirm-btn,
  .popup__cancel-btn,
  .popup__alert-btn {
    width: 50%;
    height: 45px;
    font-size: 1.2rem;
    border: 1px solid #969696;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    color: #333;
    box-shadow: inset 0 0 2px #fff;
    background-color: #cfcfcf;
  }
  .popup__button {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }
</style>
<body>
  <div class="popup__modal">
    <div class="popup">
      <div class="popup__header">
        <span class="popup__close-btn"></span>
      </div>
      <div class="popup__content--header">請確認您提供的資料是否正確：</div>
      <div class="popup__content">
        <div class="popup__item">
          <span class="popup__label">姓名：</span>
          <span class="popup__value">拆定了</span>
        </div>
        <div class="popup__item">
          <span class="popup__label">性別：</span>
          <span class="popup__value">女</span>
        </div>
        <div class="popup__item">
          <span class="popup__label">生辰：</span>
          <span class="popup__value">西元1990年01月01日</span>
          <span class="popup__value">00:00~00:59 (早子)</span>
        </div>
        <div class="popup__item">
          <span class="popup__label">感情現況：</span>
          <span class="popup__value">單身</span>
        </div>
        <div class="popup__item">
          <span class="popup__label">子息現況：</span>
          <span class="popup__value">無子女</span>
        </div>
        <div class="popup__item">
          <span class="popup__label">事業現況：</span>
          <span class="popup__value">受雇員工</span>
        </div>
      </div>
      <div class="popup__actions">
        <div class="popup__confirm-btn"><a class="popup__button">確定</a></div>
        <div class="popup__cancel-btn"><a class="popup__button">取消</a></div>
      </div>
    </div>
  </div>
</body>
</html>
