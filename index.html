    import "./js/validation.rules.js";
    import "./js/validation.config.js";
    import "./dist/wenqu.bundle.v2.0.0.js";

    window.addEventListener('load', function () {
      const formOptions = {
        customFieldLabels: {
          id: '身分證字號',
          textarea: '備註內容',
          // 可以添加更多自定義標籤
          custom_field1: '自定義欄位1',
          custom_field2: '自定義欄位2'
        },
        errorMessages: {
          sex: '請選擇您的性別',
          relationship: '請選擇您的感情狀態',
          custom_field: '請選擇自定義選項',
          default: '此欄位為必填項目'
        },
        popup_title: '自定義標題',
        birth_title: '生日'
      };

      window.wq_form.form = new wqForm('.wq-form', formOptions);

      const button = document.querySelector("#checkGo_free");
      if (button) {
        button.addEventListener("click", function (event) {
          event.preventDefault();
          if (window.wq_form?.form) {
            window.wq_form.form.validation({
              valid_action: this.getAttribute('data-href'),
            });
          }
        });
      }
    });
